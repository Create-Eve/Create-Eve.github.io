<!DOCTYPE html>
<html lang="en">
<head>
  
       
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Lodge Card</title>
     <link href="https://fonts.googleapis.com/css2?family=Redaction+50:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
   
</head>
<style>
    body {
        background-color:rgb(54, 0, 0);
        

    }
    .card {
            text-align: center;        
            padding:36px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-family: "Redaction 50";
            color: #331a00;
            box-shadow: 2px 5px #888888;
;   
        }

        .button {
           padding: 10px;
           width: 100px;
           margin: 50px;
           font-family: "Redaction 50";
           font-size: medium;
           background-color: rgb(124, 124, 124);
           color: beige;
           border-radius:10px;
        

        }
        a:link {
         color: rgb(0, 0, 0);
         background-color: transparent;
         text-decoration: none;
        }

        a:visited {
         color: rgb(131, 0, 22);
        background-color: transparent;
        text-decoration: none;
        }


        a:hover {
         color: red;
        text-decoration: underline;
        }
</style>
<body>
    
    <div class="card" style="height: 750px; width: 500px; background-color:rgb(226, 225, 225) " >
     <img src="/Card\TheBlackLodge.png" alt="" style="width: 100%; height: 300px; object-fit: fill;">
     <h1>The Black Lodge</h1>
     <p style="font-weight: bolder;">
        ""Fear and love open the doors. Two doors, two Lodges. Fear opens one, the Black. Love, the other.""
        <br>
        <button class="button">
            <a href="https://www.youtube.com/watch?v=i5KRFamuJBQ">Enter</a>
        </button>
     </p>
    </div>
</body>
</html>
