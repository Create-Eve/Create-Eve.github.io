<!DOCTYPE html>
<html lang="en">
<head>
  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Redaction+50:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <title>The Wired</title>

    <style>
        .cards {
            display: grid; 
            grid-template-columns: 1fr 1fr;
            grid-template-areas: 
            "box-1 box-8 box-8"
            "box-1 box-2 box-3"
            "box-1 box-4 box-5"
            "box-1 box-6 box-7";
            
            gap: 2em;
            padding: 10px;
            align-items: center;
            height: 300px;
            width: 400px;
            border: 5px;
        }

       
        #Logo {
            position: sticky;
            align-content: flex-start;
            top: 0;
            display: flex;
             justify-content: top;
            gap: 1em;
            flex-direction: column;
            background-color: rgba(153, 0, 255, 0.2);
            margin-top: 50px;
            height: 100%;
            padding: 20px;
            

        }

        #Wired {
            padding: 1em;
            display: flex;
            align-items: center;
            justify-content: center;
            justify-items: center;
            background-color: black;
            color: aliceblue;
            border-style: groove;
            font-family: 'Redaction 50';
            font-size: 2em;
            height: 200px;
            width: 400px;
        }
        

        @media only screen and (max-width: 700px) {

            .cards{
                display: flex;
                flex-direction: column;
                flex: 100%;
               
                font-size: 1rem;
                gap: 3em;
            }

            #Lain {
                width: 100%;
                position: static;
            }
            #Logo {
                position: sticky;
                
                
                
            }

           
        }

    </style>
</head>
<body background="Assets\Lain_BG.jpg">
    <div class="cards">
      <div id="Logo" style="grid-area: box-1">
        <img  src="Assets\Lain Logo.jpg" style="width: 400px">
        <button style="font-family: 'Redaction 50'; font-weight: bold; font-size: medium;">Start</button>
        <button style="font-family: 'Redaction 50'; font-weight: bold; font-size: medium;">Load</button>
        <button style="font-family: 'Redaction 50'; font-weight: bold; font-size: medium;">Options</button>
        <button style="font-family: 'Redaction 50'; font-weight: bold; font-size: medium;">Exit</button>
      </div>
      <div>
        <button id="Wired" style="grid-area: box-8">Enter The Wired</button>
      </div>
      <div id="Lain" style="grid-area: box-2">
        <img src="Assets\Lain_Wired.gif" style="width: 100%;">
      </div>

      <div id="Navi" style="grid-area: box-4">
        <img src="Assets\Navi.gif">
      </div>
      <div id="Lain Room" style="grid-area: box-6">
        <img src="Assets\Lain_Room.gif">
      </div>
      <div id="Train" style="grid-area: box-3">
        <img src="Assets\Train.gif">
      </div>
      <div id="Static" style="grid-area: box-5">
        <img src="Assets\Static.gif">
      </div>
      <div id="Lain Intro" style="grid-area: box-7">
        <img src="Assets\Lain Intro.gif">
      </div>
      
      
    </div>
</body>
</html>
